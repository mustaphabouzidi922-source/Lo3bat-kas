<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تحدي الكؤوس الاحترافية</title>
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --accent: #ff007f;
            --success: #28a745;
            --warning: #ffc107;
            --dark: #1a1a2e;
            --light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--dark), #16213e);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* شريط الهيدر العلوي */
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid var(--warning);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .wallet-box:hover {
            transform: scale(1.05);
        }

        .wallet-box span {
            color: var(--warning);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .level-badge {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* شريط التقدم للسحب */
        .progress-container {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 15px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--warning), var(--success));
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 3px;
            color: #aaa;
        }

        /* منطقة اللعبة الرئيسية */
        .game-container {
            flex: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .cups-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        /* تصميم الكأس */
        .cup {
            width: 70px;
            height: 120px;
            border: 4px solid var(--light);
            border-top: none;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }

        .cup.selected {
            border-color: var(--accent);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(255,0,127,0.4);
        }

        .cup-unit {
            width: 100%;
            height: 25%;
            transition: 0.3s;
        }

        /* الأزرار والتحكم */
        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent), #ff5e62);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,127,0.3);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* النوافذ المنسدلة (Modals) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--dark);
            border: 2px solid var(--primary);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-content h2 {
            color: var(--warning);
        }

        /* تأثيرات الاحتفال والنقود المتطايرة */
        .coin-particle {
            position: absolute;
            color: var(--warning);
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            animation: flyUp 1s ease-out forwards;
            z-index: 999;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }

        /* محفظة السحب */
        .wallet-methods {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .method-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--light);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .method-btn.selected {
            border-color: var(--success);
            background: rgba(40, 167, 69, 0.2);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="top-bar">
            <div class="wallet-box" onclick="openWalletModal()">
                💰 <span id="balanceText">$0.000</span> / $50.0
            </div>
            <div class="level-badge" id="levelText">المستوى 1</div>
        </div>
        <div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">حد السحب 50 دولار (USDT / PayPal)</div>
        </div>
    </header>

    <!-- منطقة اللعبة -->
    <div class="game-container" id="gameContainer">
        <div class="cups-grid" id="cupsGrid"></div>
        <div class="controls">
            <button class="btn" onclick="resetLevel()">إعادة المحاولة</button>
        </div>
    </div>

    <!-- نافذة إعلان وهمي (مضاعفة أو مساعدة) -->
    <div class="modal" id="adModal">
        <div class="modal-content">
            <h2>📢 إعلان ممول</h2>
            <p id="adDescription">شاهد إعلان قصير لمضاعفة الجائزة أو الحصول على كأس فارغ!</p>
            <button class="btn" onclick="watchAd()">مشاهدة الإعلان الآن</button>
            <button class="btn" style="background: #555;" onclick="closeAdModal()">تخطي</button>
        </div>
    </div>

    <!-- نافذة نهاية المستوى / الاحتفال -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 مبروك أنهيت المستوى!</h2>
            <p>لقد ربحت <span id="rewardText" style="color:var(--warning)">$0.001</span></p>
            <button class="btn" onclick="watchDoubleAd()">🎥 شاهد إعلان لمضاعفة المبلغ (x2)</button>
            <button class="btn" style="background:var(--success);" onclick="nextLevel()">المستوى التالي ➡️</button>
        </div>
    </div>

    <!-- نافذة المحفظة والسحب -->
    <div class="modal" id="walletModal">
        <div class="modal-content">
            <h2>💳 محفظة السحب</h2>
            <p>الرصيد الحالي: <span id="modalBalance" style="color:var(--warning); font-weight:bold;">$0.000</span></p>
            <p style="font-size: 0.9rem; color: #ccc;">حد السحب الأدنى هو 50 دولار.</p>
            
            <div class="wallet-methods">
                <div class="method-btn selected" onclick="selectMethod('USDT')">USDT</div>
                <div class="method-btn" onclick="selectMethod('PayPal')">PayPal</div>
            </div>

            <input type="text" id="walletAccount" placeholder="أدخل بريد PayPal أو محفظة USDT" style="padding: 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; text-align: center;">

            <button class="btn" style="background: var(--success);" onclick="requestWithdraw()">سحب الأرباح</button>
            <button class="btn" style="background: #555;" onclick="closeWalletModal()">إغلاق</button>
        </div>
    </div>

    <script>
        // إعدادات اللعبة
        let currentLevel = 1;
        let balance = 0.00;
        const targetBalance = 50.00;
        let selectedCupIndex = null;
        let adCallback = null;
        let selectedPaymentMethod = 'USDT';

        // ألوان السوائل
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];

        // توليد المستويات (إجمالي 300 مستوى)
        let cupsData = [];

        function initLevel() {
            selectedCupIndex = null;
            // توليد كؤوس عشوائية بناءً على المستوى
            let numCups = Math.min(3 + Math.floor(currentLevel / 50), 6); // تزيد الكؤوس تدريجياً
            cupsData = [];
            
            let activeColors = colors.slice(0, numCups - 1);
            let pool = [];
            activeColors.forEach(c => {
                for(let i=0; i<4; i++) pool.push(c);
            });
            // خلط عشوائي
            pool.sort(() => Math.random() - 0.5);

            for(let i=0; i<numCups - 1; i++) {
                cupsData.push([pool.pop(), pool.pop(), pool.pop(), pool.pop()]);
            }
            // ترك كأس فارغ
            cupsData.push([]);

            renderCups();
            document.getElementById('levelTextinnerText', `المستوى ${currentLevel}`);
            document.getElementById('levelText').innerText = `المستوى ${currentLevel}`;
        }

        function renderCups() {
            const grid = document.getElementById('cupsGrid');
            grid.innerHTML = '';
            cupsData.forEach((cup, index) => {
                const cupEl = document.createElement('div');
                cupEl.className = `cup ${selectedCupIndex === index ? 'selected' : ''}`;
                cupEl.onclick = () => selectCup(index);

                cup.forEach(color => {
                    const unit = document.createElement('div');
                    unit.className = 'cup-unit';
                    unit.style.backgroundColor = color;
                    cupEl.appendChild(unit);
                });
                grid.appendChild(cupEl);
            });
        }

        function selectCup(index) {
            if (selectedCupIndex === null) {
                if (cupsData[index].length === 0) return; // لا يمكن اختيار كأس فارغ للبداية
                selectedCupIndex = index;
            } else {
                if (selectedCupIndex === index) {
                    selectedCupIndex = null; // إلغاء التحديد
                } else {
                    // محاولة نقل السائل
                    moveLiquid(selectedCupIndex, index);
                    selectedCupIndex = null;
                }
            }
            renderCups();
        }

        function moveLiquid(from, to) {
            let fromCup = cupsData[from];
            let toCup = cupsData[to];

            if (fromCup.length === 0) return;
            
            let colorToMove = fromCup[fromCup.length - 1];
            
            // تحقق إذا كان الكأس المستهدف فارغ أو يحتوي على نفس اللون العلوي
            if (toCup.length === 0 || (toCup[toCup.length - 1] === colorToMove && toCup.length < 4)) {
                fromCup.pop();
                toCup.push(colorToMove);
                checkWin();
            } else {
                // خطأ في النقل -> إظهار إعلان للحصول على كأس فارغ إضافي
                showAdModal("خطأ في الحركة! شاهد إعلان للحصول على مساعدة (كأس فارغ إضافي).", () => {
                    cupsData.push([]); // إضافة كأس فارغ للمساعدة
                    renderCups();
                });
            }
        }

        function checkWin() {
            // تحقق إذا كل كأس إما فارغ أو ممتلئ بلون واحد بالكامل
            let won = cupsData.every(cup => cup.length === 0 || (cup.length === 4 && cup.every(v => v === cup[0])));
            if (won) {
                triggerWinEffects();
            }
        }

        function triggerWinEffects() {
            // إضافة النقود (0.001 دولار لكل مستوى)
            let earned = 0.001;
            balance += earned;
            if (balance > targetBalance) balance = targetBalance;
            updateWalletUI();

            // إظهار نافذة الفوز والاحتفال
            document.getElementById('rewardText').innerText = `$${earned.toFixed(3)}`;
            document.getElementById('winModal').classList.add('active');

            // إعلانات كل 5 مستويات
            if (currentLevel % 5 === 0) {
                setTimeout(() => {
                    alert("إعلان إجباري بين المستويات!");
                }, 500);
            }
        }

        function nextLevel() {
            document.getElementById('winModal').classList.remove('active');
            currentLevel++;
            initLevel();
        }

        function resetLevel() {
            initLevel();
        }

        // نظام الإعلانات الوهمية
        function showAdModal(text, callback) {
            document.getElementById('adDescription').innerText = text;
            adCallback = callback;
            document.getElementById('adModal').classList.add('active');
        }

        function closeAdModal() {
            document.getElementById('adModal').classList.remove('active');
            adCallback = null;
        }

        function watchAd() {
            alert("جاري عرض الإعلان... (تخيل أن إعلان فيديو يشتغل هنا)");
            if (adCallback) adCallback();
            closeAdModal();
        }

        function watchDoubleAd() {
            alert("جاري عرض إعلان المضاعفة...");
            balance += 0.001; // مضاعفة الجائزة بإضافة 0.001 أخرى
            updateWalletUI();
            document.getElementById('winModal').classList.remove('active');
            currentLevel++;
            initLevel();
        }

        // نظام المحفظة والسحب
        updateWalletUI();

        function updateWalletUI() {
            document.getElementById('balanceText').innerText = `$${balance.toFixed(3)}`;
            document.getElementById('modalBalance').innerText = `$${balance.toFixed(3)}`;
            let progress = (balance / targetBalance) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.add('active');
        }

        function closeWalletModal() {
            document.getElementById('walletModal').classList.remove('active');
        }

        function selectMethod(method) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function requestWithdraw() {
            let account = document.getElementById('walletAccount').value;
            if (!account) {
                alert("الرجاء إدخال الحساب بشكل صحيح!");
                return;
            }
            if (balance < targetBalance) {
                alert(`عذراً، رصيدك الحالي ($${balance.toFixed(3)}) لم يبلغ حد السحب الأدنى ($50.00)`);
            } else {
                alert(`تم تقديم طلب السحب بنجاح عبر ${selectedPaymentMethod} إلى الحساب: ${account}`);
                balance = 0;
                updateWalletUI();
                closeWalletModal();
            }
        }

        // بدء اللعبة لأول مرة
        initLevel();
    </script>
</body>
</html>
